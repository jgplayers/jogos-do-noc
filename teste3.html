<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos do Noc</title>

  <!-- FAVICON -->
  <link rel="icon" href="imagens/logob.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #08081b, #030312 80%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      position: relative;
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #0a0020, #100035);
      border-bottom: 2px solid rgba(138, 43, 226, 0.5);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.2);
    }

    /* IMAGEM NO LUGAR DO CÍRCULO */
    .logo-topo {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 80px;
      height: auto;
      z-index: 10;
      filter: drop-shadow(0 0 12px rgba(138, 43, 226, 0.9));
    }

    header h1 {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 2.8rem;
      background: linear-gradient(90deg, #8a2be2, #00b3ff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 10px;
      color: #aaa;
      font-size: 1rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 50px 20px;
    }

    .botoes-superiores {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .botao {
      padding: 20px 60px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      font-size: 1.3rem;
      text-decoration: none;
      transition: 0.3s;
      backdrop-filter: blur(6px);
    }

    .botao:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.6);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #050515;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <!-- IMAGEM AQUI -->
  <img src="imagens/logob.png" alt="Logo NOC" class="logo-topo">

  <h1>Jogos do Noc</h1>
  <p>Escolha sua plataforma</p>
</header>

<main>
  <div class="botoes-superiores">
    <a href="#" class="botao">💻 PC</a>
    <a href="#" class="botao">📱 Em Breve</a>
  </div>

  <a href="#" class="botao">🛠 Suporte</a>
</main>

<footer>
  © 2026 - Jogos do Noc
</footer>

</body>
</html>
